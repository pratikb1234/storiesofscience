<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">A TRANSFERABLE MESSAGE</title><desc id="desc">Two heart preparations connected by a fluid transfer; the second also slows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#a6b8ad"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#adc6b5" stroke-opacity=".05"/></pattern></defs><rect width="1200" height="720" fill="#17382e"/><rect width="1200" height="720" fill="url(#grid)"/><text x="70" y="77" fill="#a6b8ad" font-family="Georgia,serif" font-size="20" text-anchor="start">STORIES OF SCIENCE</text><text x="1130" y="77" fill="#d4b06d" font-family="Georgia,serif" font-size="24" text-anchor="end">1921</text><path d="M70 103L1130 103" fill="none" stroke="#526c5e" stroke-width="1"/><text x="600" y="162" fill="#e9e9d8" font-family="Georgia,serif" font-size="33" text-anchor="middle">A TRANSFERABLE MESSAGE</text><rect x="180" y="245" width="230" height="180" rx="20" fill="none" stroke="#a6b8ad" stroke-width="3"/><text x="295" y="315" fill="#e9e9d8" font-family="Georgia,serif" font-size="36" text-anchor="middle">Heart A</text><text x="295" y="375" fill="#e9e9d8" font-family="Georgia,serif" font-size="19" text-anchor="middle">Slows after stimulation</text><path d="M450 330L725 330" fill="none" stroke="#a6b8ad" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="290" fill="#e9e9d8" font-family="Georgia,serif" font-size="25" text-anchor="middle">Transfer fluid</text><rect x="765" y="245" width="230" height="180" rx="20" fill="none" stroke="#a6b8ad" stroke-width="3"/><text x="880" y="315" fill="#e9e9d8" font-family="Georgia,serif" font-size="36" text-anchor="middle">Heart B</text><text x="880" y="375" fill="#e9e9d8" font-family="Georgia,serif" font-size="23" text-anchor="middle">Also slows</text><text x="600" y="525" fill="#e9e9d8" font-family="Georgia,serif" font-size="32" text-anchor="middle">The effect travelled with the fluid</text><path d="M70 635L1130 635" fill="none" stroke="#526c5e" stroke-width="1"/><text x="600" y="680" fill="#a6b8ad" font-family="Georgia,serif" font-size="18" text-anchor="middle">EXPLANATORY ILLUSTRATION</text></svg>